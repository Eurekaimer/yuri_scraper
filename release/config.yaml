# YuriScraper Configuration
# Relative output_dir resolves against this file's directory.
# Restart the program after editing.

# Download directory / 下载目录
output_dir: novels

# Format: txt or epub / 输出格式
format: epub

# Concurrent workers / 并发下载数
concurrency: 8

# Requests per second per site / 每秒请求数
rate_limit: 2.0

# Retry count / 失败重试次数
retry_count: 3

startup:
  # sweep, static, or off / 启动动画
  animation: sweep
  reduced_motion: false

yamibo:
  max_concurrency: 2
  rate_limit: 1.2
  max_scan_pages: 10
  min_post_chars: 80
