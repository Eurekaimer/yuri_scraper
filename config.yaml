# YuriScraper Configuration
# Relative output_dir resolves against this file's directory.
# Restart the program after editing.

# 下载目录（相对路径相对于本文件所在目录解析）
output_dir: novels

# 输出格式: txt 或 epub
format: epub

# 并发下载数（实际生效；52书库上限 64，百合会上限 2）
concurrency: 8

# 每秒请求数（实际生效；52书库上限 20，百合会上限 1.2）
rate_limit: 2.0

# 失败重试次数
retry_count: 3

startup:
  # 启动动画: sweep、static 或 off
  animation: sweep
  reduced_motion: false

yamibo:
  max_concurrency: 2
  rate_limit: 1.2
  max_scan_pages: 10
  min_post_chars: 80
