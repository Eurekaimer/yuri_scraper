# YuriScraper Configuration
# 修改后重启程序即可生效

# 下载目录 (相对或绝对路径)
output_dir: novels

# 输出格式: txt 或 epub
format: epub

# 并发下载数 (默认 8，太大可能被封 IP)
concurrency: 8

# 每秒请求数限制 (每个站点)
rate_limit: 2.0

# 失败重试次数
retry_count: 3

yamibo:
  max_concurrency: 2
  rate_limit: 1.2
  max_scan_pages: 10
  min_post_chars: 80
