name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in binaries
        required: false
        default: v0.6.2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < release/VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test -f "release/NOTES-v${VERSION}.md"
      - run: go test -short ./...
      - run: go vet ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(tr -d '[:space:]' < release/VERSION)"
          fi
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.value }}" \
            -o "dist/yuri-scraper-v${{ steps.version.outputs.value }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" \
            ./cmd/yuri_scraper/
      - uses: actions/upload-artifact@v4
        with:
          name: yuri-scraper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve release metadata
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="release/NOTES-${TAG}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "Missing release notes: ${NOTES}"
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=YuriScraper ${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=${NOTES}" >> "$GITHUB_ENV"
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum yuri-scraper-* > "SHA256SUMS-${RELEASE_TAG}.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: dist/*
          generate_release_notes: false
